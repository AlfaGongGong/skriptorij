<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revizija</title>
<link rel="stylesheet" href="/static/css/revizija.css">
</head>
<body>
<div id="prog"></div>
<div id="kartica" style="display:none">
  <div id="tip"></div>
  <div class="box"><div class="lab">🇬🇧 Original</div><div id="en"></div></div>
  <div class="box"><div class="lab">🇧🇦 Naš prijevod</div><div id="hr"></div></div>
  <div id="glavni">
    <button id="b-ostavi">✔ U redu je, ostavi</button>
    <button id="b-ponovo">🔁 Prevedi ponovo</button>
    <button id="b-preskoci">⏭ Preskoči</button>
  </div>
  <div id="pr">
    <div class="box"><div class="lab">Prijedlog novog prijevoda</div><div id="pr-tekst"></div></div>
    <button id="b-prihvati">✔ Prihvati prijedlog</button>
    <button id="b-staro">↩ Ostavi staro</button>
  </div>
  <button id="b-ponisti">↩ Poništi prethodnu</button>
</div>
<div id="kraj" style="display:none"></div>
<div id="poruka" role="status" aria-live="polite"></div>
<div id="zavrsi">
  <button id="b-zavrsi-dry">📊 Pregled: što će se primijeniti</button>
  <button id="b-zavrsi">🏁 Završi i složi EPUB</button>
  <div class="box" id="z-status"></div>
</div>
<script>
var kartice = [], i = 0, zadnje = [], zauzet = false, prijedlog = "";
function el(id) { return document.getElementById(id); }
function poruka(t) { el("poruka").textContent = t || ""; }
function podcrtaj(cilj, kontekst, frag, rezerva) {
  cilj.textContent = "";
  var t = kontekst || rezerva || "";
  var k = frag ? t.indexOf(frag) : -1;
  if (k < 0) { cilj.textContent = t || frag || "—"; return; }
  cilj.appendChild(document.createTextNode((k > 0 ? "…" : "") + t.slice(0, k)));
  var m = document.createElement("mark"); m.textContent = frag; cilj.appendChild(m);
  cilj.appendChild(document.createTextNode(t.slice(k + frag.length) + "…"));
}
function prikazi() {
  poruka(""); prijedlog = "";
  el("pr").style.display = "none"; el("glavni").style.display = "block";
  if (i >= kartice.length) {
    el("kartica").style.display = "none";
    el("kraj").style.display = "block";
    el("kraj").textContent = kartice.length ? "Gotovo. Sve odluke su spremljene. 👍" : "Nema ništa za pregled. 🎉";
    el("prog").textContent = "";
    return;
  }
  var c = kartice[i];
  el("kraj").style.display = "none"; el("kartica").style.display = "block";
  el("prog").textContent = (i + 1) + " / " + kartice.length;
  el("tip").textContent = c.tip_naziv;
  podcrtaj(el("en"), c.en_kontekst, c.en, c.en);
  podcrtaj(el("hr"), c.hr_kontekst, c.hr, c.hr);
  el("b-ponisti").style.display = zadnje.length ? "block" : "none";
}
function salji(c, odluka, novo) {
  return fetch("/api/review/odluka", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({knjiga: c.knjiga, blok: c.blok, en: c.en, hr: c.hr, tip: c.tip, odluka: odluka, novo: novo || ""})
  }).then(function (r) { if (!r.ok) throw new Error("Server: " + r.status); return r.json(); });
}
function odluci(odluka, novo) {
  if (zauzet || i >= kartice.length) return;
  zauzet = true; var c = kartice[i];
  salji(c, odluka, novo).then(function () { zadnje.push(c); i++; prikazi(); })
    .catch(function (e) { poruka("Nije spremljeno: " + e.message); })
    .then(function () { zauzet = false; });
}
function predlozi() {
  if (zauzet || i >= kartice.length) return;
  zauzet = true; var c = kartice[i];
  poruka("Prevodim… (nekoliko sekundi)");
  fetch("/api/review/prevedi", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({id: c.id, blok: c.blok, en: c.en, hr: c.hr, tip: c.tip, en_kontekst: c.en_kontekst, hr_kontekst: c.hr_kontekst})
  }).then(function (r) { return r.json().then(function (j) { return {ok: r.ok, j: j}; }); })
    .then(function (x) {
      if (!x.ok || !x.j.prijedlog) throw new Error(x.j.error || "Nema prijedloga");
      prijedlog = x.j.prijedlog; el("pr-tekst").textContent = prijedlog;
      el("glavni").style.display = "none"; el("pr").style.display = "block"; poruka("");
    })
    .catch(function (e) { poruka("Prijevod nije uspio: " + e.message); })
    .then(function () { zauzet = false; });
}
function ponisti() {
  if (zauzet || !zadnje.length) return;
  zauzet = true; var c = zadnje[zadnje.length - 1];
  salji(c, "ponisti").then(function () { zadnje.pop(); i--; prikazi(); })
    .catch(function (e) { poruka("Nije poništeno: " + e.message); })
    .then(function () { zauzet = false; });
}
el("b-ostavi").onclick = function () { odluci("ostavi"); };
el("b-ponovo").onclick = predlozi;
el("b-preskoci").onclick = function () { odluci("preskoci"); };
el("b-prihvati").onclick = function () { odluci("prevedi_ponovo", prijedlog); };
el("b-staro").onclick = function () { odluci("ostavi"); };
el("b-ponisti").onclick = ponisti;
var zTimer = null;
function zPrikazi(s) {
  var b = el("z-status"); b.style.display = "block";
  var r = [];
  if (s.knjiga) r.push("Knjiga: " + s.knjiga);
  r.push("Stanje: " + (s.stanje || "?") + (s.korak ? " (" + s.korak + ")" : ""));
  if (s.ukupno !== undefined) {
    r.push("Odluka za primjenu: " + s.ukupno + (s.ispravke ? " | uspjelo=" + s.ispravke.ok + " već=" + s.ispravke.vec + " nije=" + s.ispravke.fail : ""));
  }
  if (s.preskoceno && s.preskoceno.length) r.push("Preskočeno: " + s.preskoceno.length);
  if (s.provjera && s.provjera.novo_u_epubu !== undefined) {
    r.push("Novi tekst u EPUB-u: " + s.provjera.novo_u_epubu + ((s.provjera.nije_nadjeno || []).length ? " (nije nađeno: " + s.provjera.nije_nadjeno.length + ")" : ""));
  }
  if (s.kapija) r.push("Kapija: gate=" + s.kapija.epub_gate + " fix=" + s.kapija.epub_fix + " audit=" + s.kapija.audit + " epubcheck=" + s.kapija.epubcheck + (s.kapija_ok ? "  ✔" : "  ✖"));
  if (s.styled) r.push("EPUB: " + s.styled);
  if (s.greska) r.push("GREŠKA: " + s.greska);
  if (s.log_fajl) r.push("Log: " + s.log_fajl);
  if (s.log_rep && s.log_rep.length) r.push("— zadnji redci —\n" + s.log_rep.slice(-6).join("\n"));
  b.textContent = r.join("\n");
}
function zPoll() {
  fetch("/api/review/zavrsi/status").then(function (r) { return r.json(); }).then(function (s) {
    zPrikazi(s);
    if (s.stanje === "tece") { zTimer = setTimeout(zPoll, 3000); }
    else { zTimer = null; el("b-zavrsi").disabled = false; el("b-zavrsi-dry").disabled = false; }
  }).catch(function (e) { poruka("Status nije dostupan: " + e.message); zTimer = setTimeout(zPoll, 5000); });
}
function zDry() {
  poruka("");
  fetch("/api/review/zavrsi", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({dry: true})})
    .then(function (r) { return r.json().then(function (j) { return {ok: r.ok, j: j}; }); })
    .then(function (x) { if (!x.ok) throw new Error(x.j.error || "Greška"); zPrikazi(x.j); })
    .catch(function (e) { poruka("Pregled nije uspio: " + e.message); });
}
function zPokreni() {
  if (zTimer) return;
  if (!confirm("Ovo upisuje prihvaćene prijevode u .chk (uz backup) i ponovo slaže EPUB. Nastaviti?")) return;
  poruka("");
  el("b-zavrsi").disabled = true; el("b-zavrsi-dry").disabled = true;
  fetch("/api/review/zavrsi", {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"})
    .then(function (r) { return r.json().then(function (j) { return {st: r.status, j: j}; }); })
    .then(function (x) {
      if (x.st !== 202 && x.st !== 409) throw new Error(x.j.error || ("Server: " + x.st));
      zPoll();
    })
    .catch(function (e) { poruka("Pokretanje nije uspjelo: " + e.message); el("b-zavrsi").disabled = false; el("b-zavrsi-dry").disabled = false; });
}
el("b-zavrsi-dry").onclick = zDry;
el("b-zavrsi").onclick = zPokreni;
fetch("/api/review/zavrsi/status").then(function (r) { return r.json(); }).then(function (s) {
  if (s && s.stanje === "tece") { el("b-zavrsi").disabled = true; el("b-zavrsi-dry").disabled = true; zPrikazi(s); zPoll(); }
}).catch(function (e) { console.log("status", e); });
fetch("/api/review/kartice").then(function (r) { return r.json(); }).then(function (d) {
  if (!Array.isArray(d)) { poruka(d.error || "Greška pri učitavanju."); return; }
  kartice = d; prikazi();
}).catch(function (e) { poruka("Greška: " + e.message); });
</script>
</body>
</html>
